<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
<title id="title">MacTrix 2 product progress</title>
<desc id="desc">Product progress is N/A because this repository has no authoritative measurable product roadmap.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02050A"/><stop offset="1" stop-color="#07111C"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0088FF"/><stop offset="1" stop-color="#62E5FF"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#62E5FF" stroke-opacity=".05"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="178" rx="22" fill="url(#bg)" stroke="#62E5FF" stroke-opacity=".24"/><rect x="1" y="1" width="1198" height="178" rx="22" fill="url(#grid)"/>
<text x="50" y="38" fill="#62E5FF" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">SWIR PROGRESS</text>
<text x="50" y="72" fill="#F4FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="800">MacTrix 2</text>
<text x="50" y="99" fill="#8DA8B8" font-family="Segoe UI,Arial,sans-serif" font-size="14">Measured scope: product roadmap</text>
<text x="1110" y="72" text-anchor="end" fill="#F4FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">N/A</text>
<text x="1110" y="99" text-anchor="end" fill="#62E5FF" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">NO AUTHORITATIVE ROADMAP</text>
<rect x="50" y="118" width="1100" height="18" rx="9" fill="#08131F" stroke="#62E5FF" stroke-opacity=".18"/>
<path d="M70 127H1130" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 12" opacity=".28"/>
<text x="50" y="159" fill="#8DA8B8" font-family="Segoe UI,Arial,sans-serif" font-size="12">No completion percentage is inferred from release version, commits, tests, or documentation.</text>
</svg>
